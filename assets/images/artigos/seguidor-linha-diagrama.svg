  <rect x="371" y="206" width="195" height="118" rx="20" fill="#143572" stroke="#007a3f" stroke-width="4"/>
  <rect x="403" y="231" width="84" height="68" rx="8" fill="#007a3f"/>
  <path d="M 505 265 H 543 M 531 253 L 543 265 L 531 277" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="M 565 230 H 598 M 565 300 H 598" stroke="#143572" stroke-width="8"/>
