  <text x="58" y="477" fill="#143572" font-family="sans-serif" font-size="20">Linha escura sobre fundo claro</text>
  <text x="48" y="550" fill="#c1ccdf" font-family="sans-serif" font-size="20">Ilustração didática · vista superior · fora de escala</text>
