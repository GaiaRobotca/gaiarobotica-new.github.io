<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Como um robô seguidor de linha lê a pista</title>
  <desc id="desc">Ilustração didática vista de cima: robô com dois motores sobre uma linha escura. Dois sensores infravermelhos ficam na frente do chassi, voltados para o chão.</desc>
  <rect width="960" height="600" fill="#0d203e"/>
  <text x="48" y="66" fill="#4cdd9b" font-family="sans-serif" font-size="26" font-weight="700">SEGUIDOR DE LINHA</text>
  <text x="48" y="100" fill="#c1ccdf" font-family="sans-serif" font-size="20">Sensores leem a pista. O robô corrige a direção.</text>
  <rect x="32" y="128" width="896" height="380" rx="24" fill="#e2eaf6"/>
  <path d="M 32 405 C 215 405 175 265 345 265 H 645 C 810 265 750 425 928 425" fill="none" stroke="#071329" stroke-width="22"/>
