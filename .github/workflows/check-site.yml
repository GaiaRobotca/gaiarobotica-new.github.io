name: Validate static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, assets and page structure
        run: python3 scripts/validate_site.py
      - name: Check shared templates are synchronized
        run: |
          python3 scripts/sync_site.py
          git diff --exit-code
      - name: Check JavaScript syntax
        run: find assets/js -name '*.js' -print0 | xargs -0 -r -n 1 node --check
